<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>湘江 NPU · Qwen3 端侧对话</title>
<style>
  :root {
    --bg: #f5f6f8; --panel: #fff; --ink: #1a1d21; --muted: #6b7280;
    --line: #e3e6ea; --accent: #0b6bcb; --ok: #16a34a; --warn: #d97706; --err: #dc2626;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; display: flex; flex-direction: column; background: var(--bg); color: var(--ink);
    font: 15px/1.65 system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 18px; background: var(--panel); border-bottom: 1px solid var(--line);
  }
  .brand { font-weight: 600; display: flex; align-items: center; gap: 4px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); display: inline-block; margin-right: 8px; flex: none; }
  .dot.loading, .dot.connecting { background: var(--warn); animation: pulse 1.1s infinite; }
  .dot.generating { background: var(--ok); animation: pulse .6s infinite; }
  .dot.ready { background: var(--ok); }
  .dot.closed, .dot.error { background: var(--err); }
  @keyframes pulse { 50% { opacity: .3; } }
  .badge { font-size: 12px; font-weight: 400; color: var(--muted); border: 1px solid var(--line); border-radius: 10px; padding: 1px 8px; margin-left: 10px; }
  .actions { display: flex; gap: 8px; }
  button {
    font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--ink);
    border-radius: 8px; padding: 5px 14px; cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover:not(:disabled) { filter: brightness(1.08); color: #fff; }

  #statusbar {
    display: flex; gap: 18px; flex-wrap: wrap; align-items: baseline;
    padding: 5px 18px; font-size: 13px; color: var(--muted);
    background: var(--panel); border-bottom: 1px solid var(--line);
  }
  #tokStats { margin-left: auto; font-variant-numeric: tabular-nums; }

  /* OS/WS 矩阵核面板：数据流在线切换（wsbench 桥，真跑在板上） */
  #owsbar {
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
    padding: 7px 18px; font-size: 13px;
    background: var(--panel); border-bottom: 1px solid var(--line);
  }
  #owsbar .owslabel { color: var(--muted); margin-right: 2px; }
  #owsbar button { padding: 3px 12px; font-size: 13px; border-radius: 7px; }
  #owsbar button.running { border-color: var(--accent); color: var(--accent); animation: pulse 1s infinite; }
  #owsResult { margin-left: auto; font-variant-numeric: tabular-nums; color: var(--muted); }
  #owsResult .pass { color: var(--ok); font-weight: 600; }
  #owsResult .fail { color: var(--err); font-weight: 600; }
  #owsResult .sim { color: var(--warn); font-size: 11px; margin-left: 6px; }

  #chat { flex: 1; overflow-y: auto; padding: 22px 18px 30px; scroll-behavior: smooth; }
  .turns { max-width: 820px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  .msg {
    max-width: 80%; padding: 10px 14px; border-radius: 14px;
    white-space: pre-wrap; word-break: break-word; overflow-wrap: anywhere;
  }
  .msg.user { align-self: flex-end; background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
  .msg.assistant { align-self: flex-start; background: var(--panel); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .msg.assistant.streaming::after { content: "▍"; color: var(--accent); animation: pulse .8s infinite; }
  .msg.system { align-self: center; font-size: 13px; color: var(--muted); background: none; padding: 2px; }
  .empty {
    align-self: center; text-align: center; color: var(--muted); font-size: 14px;
    border: 1px dashed var(--line); border-radius: 14px; padding: 26px 34px; margin-top: 8vh; line-height: 2;
  }

  footer { display: flex; gap: 10px; padding: 12px 18px; background: var(--panel); border-top: 1px solid var(--line); }
  #input {
    flex: 1; resize: none; font: inherit; padding: 10px 12px; max-height: 8em;
    border: 1px solid var(--line); border-radius: 10px; outline: none; background: var(--bg);
  }
  #input:focus { border-color: var(--accent); }

  #banner {
    position: fixed; top: 54px; left: 50%; transform: translateX(-50%);
    background: var(--err); color: #fff; padding: 6px 16px; border-radius: 8px; font-size: 13px; z-index: 40;
  }
  #toast {
    position: fixed; bottom: 86px; left: 50%; transform: translateX(-50%);
    background: #111827; color: #fff; padding: 8px 16px; border-radius: 8px; font-size: 13px; z-index: 60;
    max-width: 80vw;
  }
  [hidden] { display: none !important; }

  #diag {
    position: fixed; top: 0; right: 0; bottom: 0; width: 430px; max-width: 92vw; z-index: 30;
    background: #111827; color: #d1d5db; padding: 46px 14px 14px; overflow-y: auto;
    font: 12px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  #diag .dhead { position: absolute; top: 10px; left: 14px; right: 14px; display: flex; justify-content: space-between; align-items: center; color: #9ca3af; }
  #diag .dhead button { padding: 1px 10px; font-size: 12px; }
  #diag .line { white-space: pre-wrap; word-break: break-all; }
  #diag .line.stderr { color: #f87171; }
  #diag .line.stdout { color: #93c5fd; }
  #diag .line["data-kind"="stdout-unexpected"] { color: #fbbf24; }
  #diag .line.error { color: #fbbf24; font-weight: 600; }
  #diag .line.log { color: #6b7280; }

  #restartOverlay { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: flex; align-items: center; justify-content: center; z-index: 50; }
  .card {
    background: var(--panel); border-radius: 14px; padding: 20px 22px; width: 360px; max-width: 92vw;
    display: flex; flex-direction: column; gap: 10px;
  }
  .card h3 { margin: 0 0 4px; font-size: 15px; }
  .card .note { font-size: 12px; color: var(--muted); }
  .card label { display: flex; justify-content: space-between; align-items: center; font-size: 14px; gap: 10px; }
  .card input[type="number"] { width: 110px; font: inherit; padding: 4px 8px; border: 1px solid var(--line); border-radius: 8px; text-align: right; }
  .card .row { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
</style>
</head>
<body>

<header>
  <div class="brand"><span class="dot connecting" id="dot"></span>湘江 NPU · Qwen3-0.6B<span class="badge" id="modeBadge">…</span></div>
  <div class="actions">
    <button id="btnDiag" title="stderr / 启动日志">诊断</button>
    <button id="btnRestart">重启会话</button>
  </div>
</header>

<div id="statusbar">
  <span id="stateText">连接中…</span>
  <span id="tokStats"></span>
</div>

<div id="owsbar">
  <span class="owslabel">矩阵核数据流（板上实测）</span>
  <button data-mode="os" title="OS 数据流基线：LMA+LMB+MATMUL+SM">OS</button>
  <button data-mode="ws" title="WS 数据流：权重驻留瀑布一次">WS</button>
  <button data-mode="wskeep" title="WS-keep：MCFG2 保权重，两次 MATMULA 累加">WS-keep</button>
  <button data-mode="osback" title="WS 后回切 OS，验证数据流往返干净">OS 回切</button>
  <button data-mode="all" title="四链顺序全跑（等价板上 wsbench ALL PASS 门）">全链自检</button>
  <span id="owsResult">16×16 int8 · 单次 MCFG2 切换在数据流位变化时清驻留/累加状态</span>
</div>

<main id="chat">
  <div class="turns" id="turns">
    <div class="empty" id="empty">
      端侧对话 · 生成在板卡（ZCU102）上逐 token 流回<br>
      prefill 停顿与 token 间隔是真实硬件节奏，不是卡死<br>
      Enter 发送 · Shift+Enter 换行 · 「诊断」看 stderr
    </div>
  </div>
</main>

<footer>
  <textarea id="input" rows="1" placeholder="输入消息，Enter 发送（板上 run3 按行读，多行会折叠为一行）"></textarea>
  <button class="primary" id="btnSend" disabled>发送</button>
</footer>

<div id="banner" hidden>与服务器的连接断开，自动重连中…</div>
<div id="toast" hidden></div>

<aside id="diag" hidden>
  <div class="dhead"><span>诊断（stderr / 启动日志 / 意外输出）</span><button id="btnDiagClose">×</button></div>
  <div id="diagBody"></div>
</aside>

<div id="restartOverlay" hidden>
  <form class="card" id="restartForm">
    <h3>重启会话（换新对话 / 改采样参数）</h3>
    <div class="note">参数是 run3 的启动参数，只能重启生效；重启会清空板上对话历史。</div>
    <label>温度 temperature <input type="number" name="temperature" min="0" max="2" step="0.05"></label>
    <label>top-p <input type="number" name="topp" min="0" max="1" step="0.05"></label>
    <label>top-k <input type="number" name="topk" min="1" max="200" step="1"></label>
    <label>思考模式 <input type="checkbox" name="thinking" style="width:16px;height:16px"></label>
    <div class="row">
      <button type="button" id="btnRestartCancel">取消</button>
      <button type="submit" class="primary">重启</button>
    </div>
  </form>
</div>

<script>
'use strict';
const $ = (id) => document.getElementById(id);
const els = {
  dot: $('dot'), mode: $('modeBadge'), stateText: $('stateText'), tokStats: $('tokStats'),
  turns: $('turns'), empty: $('empty'), input: $('input'), btnSend: $('btnSend'),
  banner: $('banner'), toast: $('toast'),
  diag: $('diag'), diagBody: $('diagBody'),
  overlay: $('restartOverlay'), form: $('restartForm'),
};

let state = 'connecting';
let cur = null;            /* 流式中的 assistant 气泡 */
let lastTokT = 0, turnStart = 0, intervals = [];

/* ---------- OS/WS 矩阵核面板 ---------- */
let benchBusy = false;
let benchMode = null;      /* 正在跑的模式（按钮 running 态） */
const OWS_LABEL = { os: 'OS', ws: 'WS', wskeep: 'WS-keep', osback: 'OS 回切', all: '全链自检' };
const owsBtns = [...document.querySelectorAll('#owsbar button[data-mode]')];
function owsEnabled() {
  /* bench 直写 DTCM：只在会话不占 NPU 时放行（generating/loading 都挡）；
   * closed/error 时 run3 已退，NPU 空闲，允许 */
  return !benchBusy && (state === 'ready' || state === 'closed' || state === 'error');
}
function refreshOws() {
  for (const b of owsBtns) {
    b.disabled = !owsEnabled();
    b.classList.toggle('running', b.dataset.mode === benchMode);
  }
}
function owsRender(r) {
  const el = $('owsResult');
  if (r.phase === 'start') {
    el.innerHTML = `<span style="color:var(--accent)">${OWS_LABEL[r.mode]} 执行中…</span>`;
    return;
  }
  if (r.phase === 'error') {
    el.innerHTML = `<span class="fail">${OWS_LABEL[r.mode]} 失败</span>`;
    addDiag(`[osws] ${OWS_LABEL[r.mode]} 失败：${r.error}`, 'error');
    return;
  }
  const parts = r.rows.map((x) => `${OWS_LABEL[x.mode] || x.mode} ${x.cycles} <span class="${x.pass ? 'pass' : 'fail'}">${x.pass ? 'PASS' : 'FAIL'}</span>`);
  el.innerHTML = parts.join(' · ') + (r.simulated ? '<span class="sim">mock 仿真数字</span>' : '');
  addDiag(`[osws] ${r.label} ${r.pass ? 'PASS' : 'FAIL'}：` +
          r.rows.map((x) => `${x.mode}=${x.cycles}c`).join(' '), r.pass ? 'log' : 'error');
}
owsBtns.forEach((b) => b.onclick = async () => {
  if (!owsEnabled()) { toast(benchBusy ? 'bench 进行中' : `会话 ${state}，不能动 NPU`); return; }
  try {
    const r = await fetch('/osws/run', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ mode: b.dataset.mode }),
    });
    const d = await r.json();
    if (!r.ok) toast(d.error || `bench 失败 ${r.status}`);
  } catch { toast('bench 请求失败：连不上服务器'); }
});

/* ---------- 基础 UI ---------- */
function setDot(cls) { els.dot.className = 'dot ' + cls; }
const STATE_TEXT = {
  connecting: '连接中…',
  loading: '加载模型中（640MB mmap，冷启可达 30s）…',
  ready: '就绪 · 输入消息',
  generating: '生成中…',
  closed: '会话已结束（进程退出）· 可「重启会话」',
  error: '出错 · 详情见「诊断」',
};
function setState(s) {
  state = s;
  setDot(s);
  els.stateText.textContent = STATE_TEXT[s] || s;
  els.btnSend.disabled = s !== 'ready';
  refreshOws(); /* NPU 空闲状态变化 → bench 按钮跟着放行/收禁 */
}
let toastTimer = 0;
function toast(msg, ms = 2600) {
  els.toast.textContent = msg;
  els.toast.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { els.toast.hidden = true; }, ms);
}
function nearBottom() {
  const c = $('chat');
  return c.scrollTop + c.clientHeight >= c.scrollHeight - 48;
}
function scrollDown(force) {
  if (force || nearBottom()) $('chat').scrollTop = $('chat').scrollHeight;
}
function addMsg(role, text) {
  els.empty.hidden = true;
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  if (text !== undefined) div.appendChild(document.createTextNode(text));
  els.turns.appendChild(div);
  scrollDown(true);
  return div;
}
function finalizeCur() {
  if (!cur) return;
  cur.classList.remove('streaming');
  const n = intervals.length;
  if (n === 0 && !cur.textContent) cur.textContent = '（无输出——进程退出了？见「诊断」，可能是上下文打满）';
  else if (n > 0) {
    const avg = intervals.reduce((a, b) => a + b, 0) / n;
    els.tokStats.textContent = `上轮 ${n + 1} 片 · 平均 ${avg.toFixed(0)} ms/片 · ${(1000 / avg).toFixed(1)} 片/s · 历时 ${((performance.now() - turnStart) / 1000).toFixed(1)}s`;
  }
  cur = null;
}

/* ---------- 诊断抽屉 ---------- */
function addDiag(line, kind) {
  const div = document.createElement('div');
  div.className = 'line ' + (kind || 'stderr');
  div.dataset.kind = kind || '';
  div.textContent = `[${new Date().toLocaleTimeString()}] ${line}`;
  els.diagBody.appendChild(div);
  while (els.diagBody.childElementCount > 400) els.diagBody.firstChild.remove();
  els.diag.scrollTop = els.diag.scrollHeight;
}
$('btnDiag').onclick = () => { els.diag.hidden = !els.diag.hidden; };
$('btnDiagClose').onclick = () => { els.diag.hidden = true; };

/* ---------- SSE 事件流 ---------- */
const es = new EventSource('/events');
es.onopen = () => { els.banner.hidden = true; refreshHealth(); };
es.onerror = () => { els.banner.hidden = false; };
es.addEventListener('status', (e) => {
  const d = JSON.parse(e.data);
  if (d.mode) els.mode.textContent = d.mode;
  if (d.params) fillForm(d.params);
  if (d.state === 'ready' || d.state === 'closed' || d.state === 'error') finalizeCur();
  if (d.state === 'generating') {
    intervals = [];
    lastTokT = 0;
    turnStart = performance.now();
    cur = addMsg('assistant');
    cur.classList.add('streaming');
    els.tokStats.textContent = '';
  }
  setState(d.state);
});
es.addEventListener('user', (e) => { addMsg('user', JSON.parse(e.data).text); });
es.addEventListener('token', (e) => {
  if (!cur) { cur = addMsg('assistant'); cur.classList.add('streaming'); }
  cur.appendChild(document.createTextNode(JSON.parse(e.data).text));
  const now = performance.now();
  if (lastTokT) {
    intervals.push(now - lastTokT);
    if (intervals.length > 400) intervals.shift();
    els.tokStats.textContent = `第 ${intervals.length + 1} 片 · 间隔 ${(now - lastTokT).toFixed(0)} ms`;
  }
  lastTokT = now;
  scrollDown();
});
es.addEventListener('diag', (e) => {
  const d = JSON.parse(e.data);
  addDiag(d.line, d.kind);
});
/* OS/WS 面板事件：start/done/error 由服务器广播，多标签页看到同一份历史 */
es.addEventListener('osws', (e) => {
  const d = JSON.parse(e.data);
  if (d.phase === 'start') { benchBusy = true; benchMode = d.mode; }
  else { benchBusy = false; benchMode = null; }
  owsRender(d);
  refreshOws();
});

/* ---------- 发送 ---------- */
async function refreshHealth() {
  try {
    const h = await (await fetch('/health')).json();
    els.mode.textContent = h.mode;
    fillForm(h.params);
    benchBusy = !!h.benchBusy; /* 刷新页面时对齐服务器侧 bench 状态 */
    refreshOws();
    if (state !== 'generating' && state !== h.state) setState(h.state);
  } catch { /* 服务器没起来，SSE 横幅会提示 */ }
}
function fillForm(p) {
  if (!p) return;
  els.form.temperature.value = p.temperature;
  els.form.topp.value = p.topp;
  els.form.topk.value = p.topk;
  els.form.thinking.checked = !!p.thinking;
}
async function send() {
  const text = els.input.value.trim();
  if (!text) return;
  if (/^(exit|\/quit)$/i.test(text)) {
    toast('别发 exit——那会杀掉会话进程。想重开请用「重启会话」');
    return;
  }
  if (state !== 'ready') { toast(`状态 ${state}，等就绪再发`); return; }
  els.input.value = '';
  autosize();
  try {
    const r = await fetch('/send', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ text }),
    });
    if (!r.ok) toast((await r.json()).error || `发送失败 ${r.status}`);
  } catch { toast('发送失败：连不上服务器'); }
}
els.btnSend.onclick = send;
els.input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
function autosize() {
  els.input.style.height = 'auto';
  els.input.style.height = Math.min(els.input.scrollHeight, 128) + 'px';
}
els.input.addEventListener('input', autosize);

/* ---------- 重启（新对话 + 参数） ---------- */
$('btnRestart').onclick = () => {
  fetch('/health').then((r) => r.json()).then(fillForm).catch(() => {});
  els.overlay.hidden = false;
};
$('btnRestartCancel').onclick = () => { els.overlay.hidden = true; };
els.form.onsubmit = async (e) => {
  e.preventDefault();
  const f = new FormData(els.form);
  const params = {
    temperature: +f.get('temperature'), topp: +f.get('topp'),
    topk: +f.get('topk'), thinking: f.get('thinking') ? 1 : 0,
  };
  try {
    const r = await fetch('/restart', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ params }),
    });
    if (!r.ok) throw new Error('restart ' + r.status);
    els.overlay.hidden = true;
    els.turns.innerHTML = '';
    els.tokStats.textContent = '';
    addMsg('system', `会话已重启：新对话 · t=${params.temperature} p=${params.topp} k=${params.topk} 思考=${params.thinking ? '开' : '关'}`);
    els.empty.hidden = true;
    /* 状态条会经 SSE 走 loading→ready */
  } catch (err) {
    toast('重启失败：' + err.message);
  }
};

refreshHealth();
</script>
</body>
</html>
